version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rakshaai_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=rakshaai-super-secret-key-2026-production
      - DATABASE_URL=sqlite:///./rakshaai.db
    volumes:
      - ./uploads:/app/uploads
      - ./backend/rakshaai.db:/app/rakshaai.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rakshaai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
